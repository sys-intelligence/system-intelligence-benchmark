[project]
name = "sregym-bench"
version = "0.1.0"
description = "SREGym benchmark package"
requires-python = ">=3.11"
dependencies = [
  "system-intelligence-sdk>=0.1.0",
  "sregym>=0.0.1; python_version >= '3.12'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "src"
module-root = ""

[tool.uv.sources]
system-intelligence-sdk = { workspace = true }
sregym = { path = "sregym_core" }
