[llm]
AZURE_API_KEY = "${AZURE_API_KEY}"
AZURE_API_BASE = "${AZURE_API_BASE}"
AZURE_API_VERSION = "2024-09-01-preview"
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}"

[agent-bash-timeout]
# Claude Agent SDK Bash 命令超时参数配置
# 24小时 = 86400000 毫秒
BASH_MAX_TIMEOUT_MS = "86400000"
BASH_DEFAULT_TIMEOUT_MS = "86400000"

[hardware]
use_gpu = false

[env-docker]
image = "default"
entrypoint = "./run.sh"