[project]
name = "toposense-bench"
version = "0.1.0"
description = "TopoSense benchmark package"
requires-python = ">=3.9"
dependencies = [
  "system-intelligence-sdk>=0.1.0",
  "datasets>=2.14.0",
  "huggingface_hub>=0.16.0",
  "pandas>=1.5.0",
  "tqdm",
  "loguru",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "src"
module-root = ""

[tool.uv.sources]
system-intelligence-sdk = { workspace = true }
