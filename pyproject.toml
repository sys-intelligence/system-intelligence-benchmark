[project]
name = "system-intelligence-sdk"
version = "0.1.0"
description = "Reusable SDK for System Intelligence Benchmark"
readme = "sdk/README.md"
requires-python = ">=3.11"
authors = [{ name = "System Intelligence Team" }]
license = { text = "MIT" }
keywords = ["benchmark", "llm", "sdk", "evaluation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "litellm>=1.77.5",
  "sentence-transformers>=4.0.1",
  "scikit-learn>=1.6.1",
  "tomli>=2.0.1; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/sys-intelligence/system-intelligence-benchmark"
Repository = "https://github.com/sys-intelligence/system-intelligence-benchmark"
Issues = "https://github.com/sys-intelligence/system-intelligence-benchmark/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sdk"
module-root = ""

[tool.uv.workspace]
members = [
  "benchmarks/arteval_bench",
  "benchmarks/cache_algo_bench",
  "benchmarks/courseexam_bench",
  "benchmarks/courselab_bench",
  "benchmarks/example_bench",
  "benchmarks/sregym",
  "benchmarks/sysmobench",
  "benchmarks/toposense_bench",
]

[tool.system_intelligence]
sdk_package = "system-intelligence-sdk"

[[tool.system_intelligence.benchmark_packages]]
name = "arteval-bench"
path = "benchmarks/arteval_bench"
entry = "src/core/main.py"
depends_on = ["system-intelligence-sdk"]

[[tool.system_intelligence.benchmark_packages]]
name = "cache-algo-bench"
path = "benchmarks/cache_algo_bench"
entry = "src/main.py"
depends_on = ["system-intelligence-sdk"]

[[tool.system_intelligence.benchmark_packages]]
name = "courseexam-bench"
path = "benchmarks/courseexam_bench"
entry = "run_eval.py"
depends_on = ["system-intelligence-sdk"]

[[tool.system_intelligence.benchmark_packages]]
name = "courselab-bench"
path = "benchmarks/courselab_bench"
entry = "run_eval.py"
depends_on = ["system-intelligence-sdk"]

[[tool.system_intelligence.benchmark_packages]]
name = "example-bench"
path = "benchmarks/example_bench"
entry = "src/main.py"
depends_on = ["system-intelligence-sdk"]

[[tool.system_intelligence.benchmark_packages]]
name = "sregym-bench"
path = "benchmarks/sregym"
entry = "src/main.py"
depends_on = ["system-intelligence-sdk"]

[[tool.system_intelligence.benchmark_packages]]
name = "sysmobench-bench"
path = "benchmarks/sysmobench"
entry = "src/main.py"
depends_on = ["system-intelligence-sdk"]

[[tool.system_intelligence.benchmark_packages]]
name = "toposense-bench"
path = "benchmarks/toposense_bench"
entry = "src/main.py"
depends_on = ["system-intelligence-sdk"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
extend-select = [
  "I",    # isort
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "FA",   # flake8-future-annotations
  "Q",    # flake8-quotes
  "PGH",  # pygrep-hooks
  "RUF",  # ruff
  "W",    # pycodestyle
  "D",    # pydocstyle
  "UP",   # pyupgrade
  "YTT",  # flake8-2020
  "C90",  # mccabe
]

[tool.ruff.lint.per-file-ignores]
# Ignore all D (docstring) rules in the test folder
"**/{tests,docs,tools}/*" = [
    "D100",  # Missing docstring in public module
    "D101",  # Missing docstring in public class
    "D102",  # Missing docstring in public method
    "D103",  # Missing docstring in public function
    "D104",  # Missing docstring in public package
    "D105",  # Missing docstring in magic method
    "D106",  # Missing docstring in public nested class
    "D107",  # Missing docstring in __init__
]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true


[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"
multiline-quotes = "double"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true
quote-style = "single"

[tool.pytest.ini_options]
pythonpath = ["."]
